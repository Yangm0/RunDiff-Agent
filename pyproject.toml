[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "rundiff-agent"
version = "0.1.0"
description = "Evidence-grounded investigations of machine learning experiment runs"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "RunDiff Agent contributors" }]
dependencies = [
  "fastapi>=0.115,<1",
  "langchain-core>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "langgraph>=1.0,<2",
  "pydantic>=2.10,<3",
  "typer>=0.15,<1",
  "uvicorn>=0.34,<1",
]

[project.scripts]
rundiff = "rundiff.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/rundiff"]
